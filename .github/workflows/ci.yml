name: Integrate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
        with:
          force-install: true
      - run: npm run lint
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.os }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          force-install: true
      - uses: lukka/get-cmake@latest
      - run: rustup toolchain install 1.98.1 --profile minimal
        shell: bash
      - id: host
        run: echo "target=$(bare -p 'Bare.platform + "-" + Bare.arch')" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          prefix: npm/${{ steps.host.outputs.target }}/prebuilds
      - run: npm test
  core:
    runs-on: ubuntu-latest
    name: Core / cargo test
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: cargo test --locked
        working-directory: core
  sanitize:
    runs-on: ubuntu-latest
    name: Test / linux-x64 (address sanitizer)
    steps:
      - uses: holepunchto/actions/bare-base@v1
        with:
          force-install: true
          source: true
          flags: --debug --sanitize address
      - uses: lukka/get-cmake@latest
      - run: rustup toolchain install 1.98.1 --profile minimal
      - uses: holepunchto/actions/compile-prebuilds@v1
        with:
          flags: --debug --sanitize address
          prefix: npm/linux-x64/prebuilds
      - run: npm test
        env:
          LSAN_OPTIONS: suppressions=test/leaks.txt
